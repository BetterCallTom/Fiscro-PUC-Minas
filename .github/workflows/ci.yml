name: CI

# Roda a cada push e pull request: valida arquitetura, lint e testes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fitness functions (arquitetura)
        run: npm run arch:check

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Verificar formatação
        run: npm run format:check

      - name: Testes
        run: npm test
